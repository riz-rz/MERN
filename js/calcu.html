<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clacu</title>
    <link rel="stylesheet" href="calcu.css">
</head>
<body>
    <div class="parent">
        <form action="" class="calcu-form">
            <input type="text" name="calcu-input" id="calcu-input">
        </form>
        <div class="grid-parent">
            <div class="item1"><button onclick="appendValue(7)">7</button></div>
            <div class="item2"><button onclick="appendValue(8)">8</button></div>
            <div class="item3"><button onclick="appendValue(9)">9</button></div>
            <div class="item4"><button onclick="appendValue('*')">*</button></div>
            <div class="item5"><button onclick="appendValue(4)">4</button></div>
            <div class="item6"><button onclick="appendValue(5)">5</button></div>
            <div class="item7"><button onclick="appendValue(6)">6</button></div>
            <div class="item8"><button onclick="appendValue('/')">/</button></div>
            <div class="item9"><button onclick="appendValue(1)">1</button></div>
            <div class="item10"><button onclick="appendValue(2)">2</button></div>
            <div class="item11"><button onclick="appendValue(3)">3</button></div>
            <div class="item12"><button onclick="appendValue('-')">-</button></div>
            <div class="item13"><button onclick="appendValue('.')">.</button></div>
            <div class="item14"><button onclick="appendValue(0)">0</button></div>
            <div class="item15"><button onclick="emptyTheInput()">C</button></div>
            <div class="item16"><button onclick="appendValue('+')">+</button></div>
            <div class="item17"><button class="equals" onclick="evaluateTheInput()">=</button></div>
        </div>
    </div>
    

    <script src="calcu.js"></script>
</body>
</html>
